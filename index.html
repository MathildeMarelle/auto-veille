<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto-veille</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F2; --surface: #fff; --border: #E8E6DF;
  --text: #1C1B18; --muted: #9B9890;
  --s5: #D92B1E; --s4: #E07A1A; --s3: #1E8F52; --s2: #9B9890; --s1: #C8C5BC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header { padding: 2.5rem 3rem 0; max-width: 1280px; margin: 0 auto; }
.header-top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem; }
.site-title { font-family: 'Syne', sans-serif; font-size: 2.25rem; font-weight: 800; letter-spacing: -0.04em; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.week-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.stats-row { display: flex; gap: 1.25rem; font-size: 12px; color: var(--muted); }
.stats-row strong { color: var(--text); font-weight: 600; }

.nav-wrap { max-width: 1280px; margin: 0 auto; padding: 0 3rem; }
.nav-bar { display: flex; border-bottom: 1.5px solid var(--border); overflow-x: auto; }
.tab {
  padding: 10px 18px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  color: var(--muted); background: none; border: none; cursor: pointer;
  border-bottom: 2.5px solid transparent; margin-bottom: -1.5px;
  transition: all 0.15s; white-space: nowrap; display: flex; align-items: center; gap: 5px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

.toolbar { max-width: 1280px; margin: 0 auto; padding: 1rem 3rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.score-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.score-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-right: 2px; }
.sf {
  padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1.5px solid var(--border); background: var(--surface);
  color: var(--muted); font-family: 'DM Sans', sans-serif; transition: all 0.15s;
}
.sf:hover { border-color: var(--text); color: var(--text); }
.sf.active { background: var(--text); color: #fff; border-color: var(--text); }

.toolbar-right { display: flex; align-items: center; gap: 10px; }
.sync-info { font-size: 11px; color: var(--muted); }
.refresh-btn {
  display: flex; align-items: center; gap: 6px; padding: 7px 14px;
  border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface);
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
  color: var(--text); cursor: pointer; transition: all 0.15s;
}
.refresh-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }
.refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.refresh-btn.loading svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.grid-wrap { max-width: 1280px; margin: 0 auto; padding: 0 3rem 4rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

.card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px;
  overflow: hidden; cursor: pointer;
  transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
  display: flex; flex-direction: column;
  animation: fadeUp 0.35s ease both;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.09); transform: translateY(-3px); border-color: #D0CEC6; }

.card-img { width: 100%; height: 160px; object-fit: cover; display: block; flex-shrink: 0; }
.card-no-img { width: 100%; height: 100px; background: linear-gradient(135deg, #F0EEE8, #E4E2DA); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.75rem; opacity: 0.2; }

.card-bar { height: 3px; flex-shrink: 0; }
.s5 .card-bar { background: var(--s5); }
.s4 .card-bar { background: var(--s4); }
.s3 .card-bar { background: var(--s3); }
.s2 .card-bar { background: var(--s2); }
.s1 .card-bar { background: var(--s1); }

.card-body { padding: 1.1rem 1.2rem 1rem; display: flex; flex-direction: column; gap: 0.55rem; flex: 1; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.theme-tag { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.score-pill { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 100px; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; }
.s5 .score-pill { background: var(--s5); }
.s4 .score-pill { background: var(--s4); }
.s3 .score-pill { background: var(--s3); }
.s2 .score-pill, .s1 .score-pill { background: var(--muted); }

.card-title { font-family: 'Syne', sans-serif; font-size: 14.5px; font-weight: 700; line-height: 1.35; color: var(--text); }
.card-resume { font-size: 12.5px; line-height: 1.65; color: #6B6960; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
.card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 0.65rem; border-top: 1px solid #F0EEE8; gap: 8px; margin-top: auto; }
.card-source { font-size: 11px; color: var(--muted); }
.read-link {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: 7px; background: #F4F3EE; border: 1px solid var(--border);
  font-size: 11.5px; font-weight: 500; color: var(--text); text-decoration: none;
  transition: background 0.15s; flex-shrink: 0;
}
.read-link:hover { background: var(--text); color: #fff; }
.read-link svg { width: 10px; height: 10px; }

.skel-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; }
.skel { background: #EDEBE4; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

.empty { grid-column: 1/-1; text-align: center; padding: 4rem 2rem; }
.empty-icon { font-size: 3rem; display: block; margin-bottom: 1rem; }
.empty p { font-size: 14px; color: var(--muted); line-height: 1.7; max-width: 380px; margin: 0 auto; }
.retry-btn { margin-top: 1.25rem; padding: 10px 22px; background: var(--text); color: #fff; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }

.backdrop { display: none; position: fixed; inset: 0; background: rgba(28,27,24,0.3); backdrop-filter: blur(3px); z-index: 100; }
.backdrop.open { display: block; }
.drawer { position: fixed; top: 0; right: -520px; bottom: 0; width: 500px; background: var(--surface); z-index: 101; box-shadow: -12px 0 48px rgba(0,0,0,0.1); transition: right 0.3s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; overflow: hidden; }
.drawer.open { right: 0; }
.d-img { width: 100%; height: 200px; object-fit: cover; flex-shrink: 0; }
.d-no-img { height: 80px; background: #F4F3EE; flex-shrink: 0; }
.d-head { padding: 1.5rem 1.75rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-shrink: 0; }
.d-badges { display: flex; gap: 8px; margin-bottom: 0.65rem; flex-wrap: wrap; align-items: center; }
.d-title { font-family: 'Syne', sans-serif; font-size: 19px; font-weight: 700; line-height: 1.3; }
.close-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: #F4F3EE; cursor: pointer; font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
.close-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }
.d-body { padding: 1.5rem 1.75rem; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 1.25rem; }
.d-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.d-txt { font-size: 13.5px; line-height: 1.7; color: #4A4840; }
.d-block { display: flex; flex-direction: column; }
.impact-box { background: #FFF8F0; border-left: 3px solid var(--s4); border-radius: 0 10px 10px 0; padding: 0.85rem 1.1rem; }
.impact-box .d-txt { color: #8B4A10; font-weight: 500; }
.insight-box { background: #F4F3EE; border-radius: 10px; padding: 0.85rem 1.1rem; display: flex; gap: 10px; }
.insight-box .d-txt { color: var(--text); font-weight: 500; font-style: italic; }
.d-cta { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; background: var(--text); color: #fff; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; text-decoration: none; align-self: flex-start; transition: opacity 0.15s; }
.d-cta:hover { opacity: 0.82; }
.d-cta svg { width: 13px; height: 13px; }
.d-foot { padding: 1rem 1.75rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); flex-shrink: 0; }

.toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 200; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 768px) {
  .header, .nav-wrap, .toolbar, .grid-wrap { padding-left: 1.25rem; padding-right: 1.25rem; }
  .drawer { width: 100%; right: -100%; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="site-title">Auto-veille</div>
    <div class="header-right">
      <span class="week-label" id="week-label"></span>
      <div class="stats-row">
        <span><strong id="stat-total">—</strong> articles</span>
        <span><strong id="stat-5" style="color:var(--s5)">—</strong> critiques</span>
        <span><strong id="stat-4" style="color:var(--s4)">—</strong> importants</span>
      </div>
    </div>
  </div>
</div>

<div class="nav-wrap">
  <div class="nav-bar">
    <button class="tab active" data-tab="all">🔥 Toutes les actualités</button>
    <button class="tab" data-tab="top">⭐ Top de la semaine</button>
    <button class="tab" data-tab="IA">🤖 IA</button>
    <button class="tab" data-tab="SEO">🔍 SEO</button>
    <button class="tab" data-tab="SEA">📢 SEA</button>
    <button class="tab" data-tab="CRO">📈 CRO</button>
    <button class="tab" data-tab="Social media">📱 Social media</button>
    <button class="tab" data-tab="Cybersécurité">🔒 Cybersécurité</button>
    <button class="tab" data-tab="Education">📚 Éducation</button>
  </div>
</div>

<div class="toolbar">
  <div class="score-filters">
    <span class="score-label">Score</span>
    <button class="sf active" data-s="all">Tous</button>
    <button class="sf" data-s="5">🔴 5 – Critique</button>
    <button class="sf" data-s="4">🟠 4 – Important</button>
    <button class="sf" data-s="3">🟢 3 – Intéressant</button>
    <button class="sf" data-s="2">⚪ 2 – Secondaire</button>
  </div>
  <div class="toolbar-right">
    <span class="sync-info" id="sync-info"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="loadArticles()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.87 4.4 2.2"/><path d="M13.5 2.5v2.2h-2.2"/></svg>
      Actualiser
    </button>
  </div>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div id="d-img-wrap"></div>
  <div class="d-head">
    <div style="flex:1">
      <div class="d-badges" id="d-badges"></div>
      <div class="d-title" id="d-title"></div>
    </div>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="d-body">
    <div class="d-block"><div class="d-lbl">Résumé</div><div class="d-txt" id="d-resume"></div></div>
    <div class="impact-box d-block"><div class="d-lbl">Impact business</div><div class="d-txt" id="d-impact"></div></div>
    <div class="insight-box"><span style="font-size:18px;flex-shrink:0;margin-top:2px">💡</span><div><div class="d-lbl">Insight actionnable</div><div class="d-txt" id="d-insight"></div></div></div>
    <div id="d-cta-wrap"></div>
  </div>
  <div class="d-foot"><span id="d-source"></span><span id="d-date"></span></div>
</div>

<div class="toast" id="toast"></div>

<script>
let all = [], activeTab = 'all', activeScore = 'all';

const EXT = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2H2a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V7"/><path d="M8 1h3v3"/><path d="M11 1L5.5 6.5"/></svg>`;

const SHEET_ID = '1NJbHop0eLQk_76wl6yYKEJBgCu-Spe0CIoBdntS1Su8';

async function fetchGoogleSheets() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Feuille1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Erreur Google Sheets ' + res.status);
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  return json;
}

function parsePages(data) {
  const cols = data.table.cols.map(c => c.label);
  const idx = name => cols.findIndex(c => c.toLowerCase().includes(name.toLowerCase()));
  const iTitle = idx('Titre'), iResume = idx('Résumé'), iCategorie = idx('Catégorie');
  const iScore = idx('Score'), iComment = idx('Comment'), iSource = idx('Source');
  const iUrl = idx('URL'), iDate = idx('Date'), iImage = idx('Image');

  return (data.table.rows || []).map(row => {
    const v = i => (i >= 0 && row.c[i]) ? (row.c[i].v || row.c[i].f || '') : '';
    const title   = v(iTitle) || '(sans titre)';
    const resume  = v(iResume);
    const theme   = v(iCategorie);
    const score   = parseFloat(v(iScore)) || 0;
    const impact  = v(iComment);
    const insight = v(iComment);
    const source  = v(iSource);
    const url     = v(iUrl);
    const date    = v(iDate);
    const image   = v(iImage) || null;
    let domain = source || '';
    try { if (url) domain = new URL(url).hostname.replace('www.',''); } catch(_) {}
    return { title, url, resume, impact, insight, theme, score, date, image, domain };
  }).filter(a => a.title !== '(sans titre)' || a.url);
}

function sc(s) {
  if (s >= 5) return 's5';
  if (s >= 4) return 's4';
  if (s >= 3) return 's3';
  if (s >= 2) return 's2';
  return 's1';
}

function cardHTML(a, idx) {
  const s = sc(a.score);
  const imgH = a.image
    ? `<img class="card-img" src="${a.image}" alt="" loading="lazy" onerror="this.outerHTML='<div class=card-no-img>📄</div>'">`
    : `<div class="card-no-img">📄</div>`;
  const linkH = a.url
    ? `<a class="read-link" href="${a.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${EXT} Lire</a>` : '';
  return `<div class="card ${s}" onclick="openDrawer(${idx})" style="animation-delay:${(idx%12)*0.04}s">
    ${imgH}<div class="card-bar"></div>
    <div class="card-body">
      <div class="card-top"><span class="theme-tag">${a.theme||'—'}</span><span class="score-pill">★ ${a.score}</span></div>
      <div class="card-title">${a.title}</div>
      <div class="card-resume">${a.resume||''}</div>
      <div class="card-footer"><span class="card-source">${a.domain||a.theme}</span>${linkH}</div>
    </div>
  </div>`;
}

function skelHTML(n) {
  return Array.from({length:n},()=>`<div class="skel-card">
    <div class="skel" style="height:160px;border-radius:0"></div>
    <div style="padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:10px">
      <div class="skel" style="height:11px;width:55%;border-radius:4px"></div>
      <div class="skel" style="height:17px;width:90%;border-radius:4px"></div>
      <div class="skel" style="height:13px;width:100%;border-radius:4px"></div>
      <div class="skel" style="height:13px;width:70%;border-radius:4px"></div>
    </div>
  </div>`).join('');
}

function render() {
  const grid = document.getElementById('grid');
  const filtered = all.filter(a => {
    const tabOk = activeTab==='all' ? true : activeTab==='top' ? a.score>=4 : a.theme===activeTab;
    const scoreOk = activeScore==='all' || String(Math.round(a.score))===activeScore;
    return tabOk && scoreOk;
  });
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><span class="empty-icon">${all.length?'◌':'⚠️'}</span><p>${all.length?'Aucun article ne correspond aux filtres.':'Impossible de charger les articles depuis Notion.'}</p>${!all.length?'<button class="retry-btn" onclick="loadArticles()">Réessayer</button>':''}</div>`;
    return;
  }
  grid.innerHTML = filtered.map((a,i) => cardHTML(a, all.indexOf(a))).join('');
  document.getElementById('stat-total').textContent = all.length;
  document.getElementById('stat-5').textContent = all.filter(a=>a.score>=5).length;
  document.getElementById('stat-4').textContent = all.filter(a=>a.score>=4&&a.score<5).length;
}

async function loadArticles() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true; btn.classList.add('loading');
  document.getElementById('grid').innerHTML = skelHTML(9);
  try {
    const data = await fetchGoogleSheets();
    all = parsePages(data).sort((a,b) => b.score - a.score);
    document.getElementById('sync-info').textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    render();
    showToast(`✓ ${all.length} articles chargés`);
  } catch(e) {
    console.error(e);
    document.getElementById('grid').innerHTML = `<div class="empty"><span class="empty-icon">⚠️</span><p>Erreur de connexion à Google Sheets.<br><small>${e.message}</small></p><button class="retry-btn" onclick="loadArticles()">Réessayer</button></div>`;
  } finally { btn.disabled=false; btn.classList.remove('loading'); }
}

function openDrawer(idx) {
  const a = all[idx]; const s = sc(a.score);
  const colors = {s5:'var(--s5)',s4:'var(--s4)',s3:'var(--s3)',s2:'var(--muted)',s1:'var(--muted)'};
  document.getElementById('d-img-wrap').innerHTML = a.image
    ? `<img class="d-img" src="${a.image}" alt="" onerror="this.outerHTML='<div class=d-no-img></div>'">`
    : `<div class="d-no-img"></div>`;
  document.getElementById('d-badges').innerHTML = `
    <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:3px 10px;background:#F4F3EE;border-radius:100px">${a.theme||'—'}</span>
    <span style="font-size:12px;font-weight:700;color:#fff;padding:4px 11px;border-radius:100px;background:${colors[s]}">★ ${a.score} / 5</span>`;
  document.getElementById('d-title').textContent = a.title;
  document.getElementById('d-resume').textContent = a.resume || '—';
  document.getElementById('d-impact').textContent = a.impact || '—';
  document.getElementById('d-insight').textContent = a.insight || '—';
  document.getElementById('d-source').textContent = a.domain || a.theme;
  document.getElementById('d-date').textContent = a.date;
  document.getElementById('d-cta-wrap').innerHTML = a.url
    ? `<a class="d-cta" href="${a.url}" target="_blank" rel="noopener">${EXT} Lire l'article original</a>` : '';
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  activeTab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  b.classList.add('active'); render();
}));
document.querySelectorAll('.sf').forEach(b => b.addEventListener('click', () => {
  activeScore = b.dataset.s;
  document.querySelectorAll('.sf').forEach(t => t.classList.remove('active'));
  b.classList.add('active'); render();
}));

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

(function() {
  const now = new Date(), day = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - (day===0?6:day-1));
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const fmt = d => d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  document.getElementById('week-label').textContent = `Semaine du ${fmt(mon)} au ${fmt(sun)}`;
})();

loadArticles();
</script>
